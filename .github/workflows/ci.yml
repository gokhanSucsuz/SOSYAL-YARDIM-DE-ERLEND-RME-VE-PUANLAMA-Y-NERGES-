name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Type Checking
      run: npx tsc --noEmit

    - name: Run Unit Tests
      run: npm run test --if-present

    - name: Build Next.js
      run: npm run build
      env:
        # Ignore TypeScript and ESLint errors during build if we only want to warn,
        # but here we want strict builds so we do not ignore them.
        NEXT_TELEMETRY_DISABLED: 1
